name: ai-registration

services:
  db:
    image: mongo:latest
    container_name: ai-registration-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: ai-registration-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend-python/.env
    environment:
      MONGO_URI: mongodb://ai-registration-mongodb:27017/ai_registration
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile
    container_name: ai-registration-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
